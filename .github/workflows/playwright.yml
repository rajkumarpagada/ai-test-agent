name: AI Test Agent — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Debug credentials
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: |
          echo "SAUCE_USERNAME is set: ${{ secrets.SAUCE_USERNAME != '' }}"
          echo "USERNAME value: $SAUCE_USERNAME"

      - name: Run Playwright tests
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: npx playwright test tests/SCRUM-7/SCRUM-7.spec.ts tests/SCRUM-8/SCRUM-8.spec.ts

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
