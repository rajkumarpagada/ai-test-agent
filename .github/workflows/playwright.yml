name: AI Test Agent — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest --config jest.config.js

      - name: Run AI Test Agent Watcher
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: SCRUM
          TEST_WEBSITE_URL: https://www.saucedemo.com
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          TOKEN_CUSTOM_GITHUB: ${{ secrets.TOKEN_CUSTOM_GITHUB }}
          REPO_GITHUB: ${{ secrets.REPO_GITHUB }}
        run: npx tsx src/watcher.ts

      - name: Run all Playwright tests
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          HOME: /root
        run: npx playwright test tests/

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
